<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOTA DASHBOARD | Alucinando Agency</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-[#FDFCFE] text-[#1E0B42] overflow-x-hidden"
    style="background-image: radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.03) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.03) 0px, transparent 50%);">

    <!-- Mobile Header -->
    <header
        class="lg:hidden bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="h-6">
                <img src="{{ url_for('static', filename='img/logotype_lavender.png') }}" alt="Alucinando"
                    class="h-full object-contain">
            </div>
            <div class="w-[1px] h-4 bg-slate-200"></div>
            <div class="h-7 bg-[#1E0B42] rounded px-2 py-1 flex items-center justify-center shadow-sm">
                <img src="{{ url_for('static', filename='img/flota_logo.png') }}" alt="Flota"
                    class="h-full object-contain opacity-100">
            </div>
        </div>
        <button id="mobile-menu-toggle" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
            <i data-lucide="menu"></i>
        </button>
    </header>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden lg:hidden"></div>

    <div class="flex">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="fixed lg:sticky top-0 left-0 h-screen w-64 bg-[#1E0B42] text-white z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0 overflow-y-auto border-r border-white/5">
            <div class="p-6 h-full flex flex-col">
                <!-- Logo Desktop -->
                <div class="hidden lg:flex items-center gap-3 mb-10">
                    <div class="w-10 h-10 rounded-xl overflow-hidden flex items-center justify-center">
                        <img src="{{ url_for('static', filename='img/isotype.png') }}" alt="Alucinando Isotype"
                            class="w-full h-full object-contain">
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="h-6">
                            <img src="{{ url_for('static', filename='img/flota_logo.png') }}" alt="Flota"
                                class="h-full object-contain">
                        </div>
                        <span
                            class="text-[10px] text-violet-300 uppercase tracking-[0.2em] font-semibold">Dashboard</span>
                    </div>
                </div>

                <nav class="space-y-1 flex-1">
                    <button data-section="dashboard"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 bg-violet-600 shadow-xl shadow-violet-900/40">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span class="font-medium">Dashboard</span>
                    </button>
                    <button data-section="metrics"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 text-violet-200/60 hover:text-white hover:bg-white/5">
                        <i data-lucide="calendar" class="w-5 h-5"></i>
                        <span class="font-medium">Métricas Diarias</span>
                    </button>
                    <button data-section="campaigns"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 text-violet-200/60 hover:text-white hover:bg-white/5">
                        <i data-lucide="layers" class="w-5 h-5"></i>
                        <span class="font-medium">Campañas</span>
                    </button>
                    <button data-section="pipeline"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 text-violet-200/60 hover:text-white hover:bg-white/5">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        <span class="font-medium">Proceso de Venta</span>
                    </button>
                </nav>

                <!-- Brand Footer -->
                <div class="mt-auto pt-6 border-t border-white/10">
                    <div class="p-4 bg-white/5 rounded-2xl border border-white/5 backdrop-blur-sm">
                        <p class="text-[10px] text-violet-300 uppercase tracking-widest mb-3 font-bold">Powered by</p>
                        <div class="h-6">
                            <img src="{{ url_for('static', filename='img/logotype_white.png') }}"
                                alt="Alucinando Marketing" class="h-full object-contain opacity-90">
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-h-screen p-4 lg:p-8 overflow-hidden">
            <!-- Header Desktop -->
            <div class="hidden lg:flex items-center justify-between mb-8">
                <div>
                    <h1 id="page-title" class="text-2xl font-bold text-slate-800">Dashboard de Resultados</h1>
                    <p class="text-slate-500">Visualización en tiempo real de Meta Ads</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <select id="month-filter"
                            class="appearance-none bg-white px-4 py-2 pr-10 rounded-xl border border-slate-200 shadow-sm text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer">
                            <!-- Opciones generadas en JS -->
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Area (Rendered via JS) -->
            <div id="content-area" class="animate-in fade-in duration-500">
                <!-- Loader Placeholder -->
                <div class="flex flex-col items-center justify-center min-h-[60vh] text-slate-400">
                    <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4">
                    </div>
                    <p>Cargando métricas...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
